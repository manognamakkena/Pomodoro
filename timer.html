<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body class="timerBody">
        <div class="globeContainer">
            <img src="assets/snowglobe.png" class="globe">
        </div>

        <div class="timerBlock">
            00:00
        </div>

        <div class="input">
            <label class = "custom-radio"><input type="radio" name="min" value="25"> 25 </label>
            <label class = "custom-radio"><input type="radio" name="min" value="50"> 50 </label>
            <label class = "custom-radio"><input type="radio" name="min" value="60"> 60 </label>
        
            <button id="start" class="start"> ▶ </button>
        </div>

        <iframe class="playlist" data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5A71wQZamgz6yZq4vKo91y?utm_source=generator&si=6d5f874840be42f5" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

        <div class = "snowman">
            <img src="assets/pfp.jpg" class="snowmanImg">
        </div>
        <div class="scene">
            HIHIHIHI
        </div>
    </body>
</html>
